<!doctype html>
<html lang="fr" data-app="admin">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#04244F">
  <meta name="robots" content="noindex">
  <title>Talib Multi Services · Back-office</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="commun/vendor/polices.css">
  <link rel="stylesheet" href="commun/kolis.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <header class="barre-mobile" data-barre-mobile>
    <button class="btn btn-rond" type="button" data-ouvrir-menu aria-label="Ouvrir le menu" aria-expanded="false"><span data-ic="liste"></span></button>
    <span class="titre-mobile" data-titre-mobile>Back-office</span>
    <span class="pastille-nb cache" data-nb-rec-mobile></span>
  </header>
  <div class="voile-menu" data-voile></div>
  <div class="cadre-admin">
    <aside class="menu" data-menu id="menu">
      <a href="#/" class="logo-admin" aria-label="Talib Multi Services · tableau de bord"><img src="commun/logo.png" alt="Talib Multi Services" width="180" height="123"></a>
      <nav class="pile" style="--gap:2px" aria-label="Menu">
        <div class="groupe-menu">Activité</div>
        <a href="#/" data-nav="bord"><span data-ic="grille"></span>Tableau de bord</a>
        <a href="#/colis" data-nav="colis"><span data-ic="colis"></span>Colis</a>
        <a href="#/lots" data-nav="lots"><span data-ic="lot"></span>Lots et manifestes</a>
        <a href="#/courses" data-nav="courses"><span data-ic="moto"></span>Courses à domicile</a>
        <div class="groupe-menu">Clients</div>
        <a href="#/reclamations" data-nav="reclamations"><span data-ic="alerte"></span>Réclamations <span class="pastille-nb cache" data-nb-rec></span></a>
        <a href="#/avis" data-nav="avis"><span data-ic="etoile"></span>Avis clients <span class="pastille-nb cache" data-nb-avis></span></a>
        <div class="groupe-menu">Argent</div>
        <a href="#/caisses" data-nav="caisses"><span data-ic="billet"></span>Caisses</a>
        <a href="#/factures" data-nav="factures"><span data-ic="liste"></span>Factures</a>
        <div class="groupe-menu">Réglages</div>
        <a href="#/reglages" data-nav="reglages"><span data-ic="prix"></span>Tarifs et agences</a>
        <a href="#/equipe" data-nav="equipe"><span data-ic="equipe"></span>Équipe</a>
      </nav>
      <div class="encart-taux" data-taux></div>
      <button class="btn btn-petit sortir" data-mdp>Mon mot de passe</button>
      <button class="btn btn-petit sortir" data-sortir><span data-ic="sortie"></span>Déconnexion</button>
    </aside>
    <main id="contenu" tabindex="-1"></main>
  </div>
  <div class="etiquette" data-etiquette aria-hidden="true"></div>
  <script src="commun/tarif.js"></script>
  <script src="commun/kolis.js"></script>
  <script src="commun/legal.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
