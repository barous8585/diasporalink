<!doctype html>
<html lang="fr" data-app="client">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E5A3C">
  <title>Paiement</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="commun/kolis.css">
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background: var(--vert); }
    .carte { max-width: 420px; width: 100%; text-align: center; padding: 32px 24px; border-radius: 22px; }
    .rond { width: 72px; height: 72px; border-radius: 36px; background: var(--vert-doux); color: var(--vert); display: flex; align-items: center; justify-content: center; margin: 0 auto; }
  </style>
</head>
<body>
  <main class="carte pile" style="--gap:16px" id="zone">
    <div class="chargement" aria-label="Vérification du paiement"></div>
  </main>
  <script src="commun/kolis.js"></script>
  <script>
    (async () => {
      const zone = document.getElementById('zone');
      const id = new URLSearchParams(location.search).get('session_id');
      try {
        const r = await K.api.get(`/paiements/verifier/${encodeURIComponent(id)}`);
        if (!r.paye) throw new Error('Le paiement n\'est pas encore confirmé. Revenez dans quelques minutes.');
        zone.innerHTML = `
          <div class="rond">${K.ic('ok', 'ic-lg')}</div>
          <h1>Paiement reçu</h1>
          <p class="muet">Merci ! Le paiement est enregistré sur le colis <b>${K.esc(r.numeroSuivi)}</b>.</p>
          <a class="btn btn-principal btn-grand btn-plein" href="./#/suivi/${encodeURIComponent(r.numeroSuivi)}">Voir le suivi</a>`;
      } catch (e) {
        zone.innerHTML = `<h1>Paiement</h1><p class="bandeau bandeau-ocre">${K.esc(e.message)}</p><a class="btn btn-plein" href="./">Retour à l'accueil</a>`;
      }
    })();
  </script>
</body>
</html>
